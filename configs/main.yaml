data:
  raw_path: data/raw/Bei_800x800x800.raw
  raw_shape: [800, 800, 800]
  voxel_size_m: 3.5e-6
  patch_size: 256
  stride: 32
  real_samples_per_target: 100

training:
  device: cuda
  n_samples: 1000
  batch_vae: 1
  batch_ddpm: 1
  epochs_vae: 50
  epochs_ddpm: 300

generation:
  targets: [0.11, 0.12, 0.13, 0.14, 0.15]
  n_per_target: 100
  seed_start: 0

model:
  downsample_factor: 4
  embedding_dim: 32
  num_embeddings: 1024
  n_steps: 1000
  poro_center: 0.13
  poro_scale: 0.02

evaluation:
  r_max: 128

paths:
  checkpoint_dir: outputs/main_sandstone
  final_checkpoint_dir: savedmodels/main_sandstone
  real_root: data/real256_sets_from_S1_strict
  generated_root: data/generated_phi_sets
  results_root: results
  curve_results: results/fig_s2
  table_results: results/tables
  topology_results: results/fig_pnm
  source_data_results: results/source_data

demo:
  summary_root: examples

# Spatially separated VQ-VAE/DDPM workflow introduced after the v0.1.1
# manuscript release.  The legacy main/full/final modes remain unchanged;
# select it explicitly with ``run_pipeline.py --mode spatial``.
spatial_vqaware:
  raw_path: data/raw/Bei_800x800x800.raw
  checkpoint_dir: outputs/spatial_vqaware
  probability_root: outputs/spatial_vqaware/condition_sweep
  generated_root: data/generated_phi_sets_spatial
  device: cuda
  variant: vq
  condition_mode: film
  n_train_samples: 1000
  n_val_samples: 64
  batch_vae: 1
  batch_ddpm: 1
  epochs_vae: 15
  epochs_ddpm: 40
  local_phi_weight: 0.10
  boundary_weight: 0.05
  dice_weight: 0.20
  lambda_codebook: 0.0
  codebook_sample_voxels: 8192
  training_poro_center: 0.13
  training_poro_scale: 0.02
  training_poro_clip: 5.0
  sampling_poro_scale: 0.011804
  sample_checkpoint: unet_best_noise.pth
  targets: [0.11, 0.12, 0.13, 0.14]
  samples_per_target: 20
  seed: 20260928
  tp_aqb_config: configs/tp_aqb_v2.yaml
