# TP-AQB v2 -- frozen final configuration
#
# v1 is NOT superseded as a record: tp_aqb_v1/ and its config are untouched and
# still hash to what they hashed to.  v2 exists because v1 has a defect that is
# unreachable on the Validation cohort and reachable outside it.
#
# THE DEFECT (v1): `_delete_to_count` computed `need = cur.sum() - N_target`
# ONCE, outside the relax ladder.  Each level reset its own counter but re-charged
# the full original deficit, and the only termination test was the per-level
# counter, never `cur.sum() <= N_target`.  Deletions therefore accumulated across
# levels and overshot.  Fingerprint: infeasible=True together with shortfall < 0.
#
# WHAT v2 CHANGES: `_delete_to_count` only.  Nothing else in the file differs --
# `_add_to_count`, the score, the ladder order, the simple-point rule, 26/6
# connectivity, skeleton protection and radii, throat quantile and radius,
# w_prob, the local swap, swap_rounds, max_pairs, the surface target and the
# tie-break are byte-identical to v1.
#
#   * remaining is re-derived at every level entry (exit if 0, raise if < 0);
#   * quota = min(remaining, n_safe) -- never more than what is actually left;
#   * assert cur.sum() >= N_target after every wave;
#   * success -> infeasible=False, shortfall=0;
#     failure -> infeasible=True,  shortfall = cur.sum() - N_target > 0.
#     A negative shortfall is not representable.

name: TP-AQB
version: 2
candidate: S1
supersedes: TP-AQB v1 (bug-fix provenance summarized below; the historical regression report is not distributed)

# ---- backbone: the R3 arm of the section-13 ladder, frozen ---------------
# Byte-identical to run_screen.ARMS["R3"] and to v1's backbone block.
backbone:
  skeleton: true
  skeleton_radius: 1
  throat: true
  throat_quantile: 0.50
  throat_radius: 2      # MUST exceed skeleton_radius or the throat branch is a
                        # subset of the skeleton branch and the knob is inert
  porebody_pref: false
  w_prob: 1.0           # the only nonzero score weight -- deletion is by
  w_dist: 0.0           # probability descending; every other weight measured
  w_body: 0.0           # and left at zero rather than tuned
  w_scale: 0.0
  w_face: 0.0
  face_greedy: false
  wave_cap: 0
  target_dS: null
  max_waves: 40

# ---- section-16 local swap repair (unchanged) ---------------------------
swap:
  swap_rounds: 12
  swap_max_pairs: 4000
  swap_tol: 0           # drive the surface to OFF's count exactly, not merely
                        # close; the residual is reported as a result
  swap_pref_deleted: true

# ---- what the algorithm is allowed to read ------------------------------
inputs:
  allowed: [probability volume P, target porosity phi_target, P >= 0.5]
  forbidden: [any real crop's S/V, any real crop's descriptors, Test results]
  note: >-
    Unchanged from v1.  The repair target is the surface count of the method's
    OWN P >= 0.5 volume.  REAL enters only in the reduction, after this file
    was frozen.  Nothing in this task read cfb15, cfb13 or cfb08.

# ---- provenance ---------------------------------------------------------
hashes:
  "src/sampling/tp_aqb.py": 2d14b997ebfcef40a1595e11c408b3444ed195938b59966e3a6c017cce69e889

# Historical experiment-side names retained in the frozen research record but
# not distributed by this repository: TP_AQB_V2_REGRESSION_REPORT.md,
# test_low_phi.py, a5_v2_rerun.py, a5_compare.py, and a5_ef_subset.py.
# The historical file called tp_aqb_v2.py is published here, unchanged in
# algorithmic content, as src/sampling/tp_aqb.py; the hash above verifies it.

# ---- the A4 stress test that reaches the bug ----------------------------
low_porosity_stress_test:
  fixtures:
    F1_val_cohort:    val_gen/vc_x006_y070_z544_prob.npz  targets 0.130 0.115 0.100 0.085 0.070
    F2_lowphi_target: gen_probs/t0p0853_s2026100100_prob.npz (phi_OFF 0.2245)
                      targets 0.20 0.17 0.13 0.10 0.085
  rows_failing_any_check:  v1 1/10   v2 0/10
  rows_that_over_deleted:  v1 1/10   v2 0/10
  feasible_but_inexact:    v2 0/10
  neutrality_rows_relax0_byte_identical: 9/9
  worst_row:
    fixture: F2_lowphi_target
    target_phi: 0.085
    v1: voxel_error -527934, relax_level 4, infeasible true, shortfall -527934
        -> achieved phi 0.053533, which is 37.0% below the requested 0.085
    v2: voxel_error 0, relax_level 1, infeasible false, shortfall 0
        -> achieved phi 0.085000
  checker_has_power: true    # the same checks fail on v1, so they can go red

# ---- Validation acceptance, measured on all 64 crops --------------------
# Unchanged from v1, and re-derived rather than inherited: A5_REGRESSION.json
# and A5_EF.json.
acceptance:
  gate_A_phi_exact: 64/64
  gate_B_broken_percolation_axes: 0        # OFF percolates 192/192 axes
  gate_C_s2_vs_OFF: significant win on all four axes
  gate_E_worst_descriptor_ratio_to_OFF: 1.033   # gate is <= 1.10
  gate_F_Kgeom_median_ratio_to_OFF: 0.941       # gate is <= 1.10; beats OFF
  gate_F_Kgeom_median_ratio_to_ON: 0.774
  preservation_drift_from_OFF_interfaces:
    mean: 1.000
    median: 1.0
    p95: 2.0
    max: 2
    crops_exactly_zero: 32/64
  gate_D_ratio_to_OFF: 1.000000
  # honesty note carried from v1: S1 is exactly as far from REAL as OFF is, not
  # closer.  signed error to REAL: OFF -1.187018e-03, S1 -1.187048e-03

# ---- the regression evidence (section A5) -------------------------------
regression:
  crops: 64                     # 62 re-run, 2 reused from a prior smoke test
  file_identity_vs_delivered_v1: 320/320   # R1 R2 R3 S0 S1 x 64 crops, sha1
  segment_bit_identity_in_process: 64/64   # per arm R1 R2 R3
  relax_level_zero: v1-in-process 64/64, v2 64/64, v1-delivered 64/64
  measured_columns: max |numeric difference| 0.000e+00, 0 bool mismatches
  s2_edt_curves: 960 arrays compared, max |diff| 0.000e+00
  gates_rescored: 121 quantities, 0 differ
  gates_rescore_positive_control: 21/121 quantities move on a mispaired cohort
  gates_E_F_instruments: 8 crops x 5 arms x 2 stages
    scalars compared 480, differing 0
    arrays  compared 320, differing 0

# ---- the one declared difference ----------------------------------------
declared_difference:
  what: >-
    On a delete that succeeds, v2 writes info["shortfall"] = 0 and v1 leaves the
    key absent.
  effect_on_returned_volume: none    # tiers 1-3 of A5 demonstrate this
  counted: >-
    62/64 crops take the delete branch (v2 writes 0, v1 omits the key).  The
    remaining 2, vc_x031_y162_z544 and vc_x054_y101_z544, take the ADD branch
    here, and _add_to_count writes no shortfall key in either version -- so
    those two are identical between v1 and v2 at the info-dict level too.
