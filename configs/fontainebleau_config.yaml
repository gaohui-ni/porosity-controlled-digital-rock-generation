# Fontainebleau sandstone example configuration.
# Raw volume must be uint8 with 0=solid and 1=pore.
raw_path: "data/fontainebleau/phi0p2045.raw"
raw_shape: [480, 480, 480]
voxel_size_um: 5.68
patch_size: 256
stride: 32
# Exactly three parent rocks are used by the current manuscript. Repository
# target keys retain historical filenames; measured manuscript porosities are
# mapped explicitly below. Do not add a historical fourth rock to this run.
# The declared 20/20 design remains here, but the public repository does not
# include the final-v2 Fontainebleau checkpoint or a complete sample manifest;
# see docs/fontainebleau_provenance_audit.md before claiming direct reproduction.
real_samples_per_target: 20
training_porosity: 0.2045
unseen_targets: [0.1743, 0.1263]
validation_targets: [0.2045, 0.1743, 0.1263]
n_per_target: 20
epochs_vae: 80
epochs_ddpm: 150
poro_center: 0.13
poro_scale: 0.02
final_checkpoint_dir: "savedmodels/fontainebleau_phi0p2045"
real_root: "data/fontainebleau_real_sets"
generated_root: "data/generated_fontainebleau_sets"
results_root: "results/fig_fontainebleau"
real_volumes:
  "0.2045": "data/fontainebleau/phi0p2045.raw"
  "0.1743": "data/fontainebleau/phi0p1743.raw"
  "0.1263": "data/fontainebleau/phi0p1263.raw"
measured_volume_porosity:
  "0.2045": 0.2041
  "0.1743": 0.1766
  "0.1263": 0.1289
